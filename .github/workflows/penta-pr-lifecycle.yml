name: Penta PR Lifecycle

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '27 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: pr, merge, closer, or auto
        required: false
        default: auto

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - id: pick
        shell: bash
        run: |
          requested='${{ github.event.inputs.mode }}'
          schedule='${{ github.event.schedule }}'
          if [[ -n "$requested" && "$requested" != auto ]]; then
            mode="$requested"
          elif [[ "$schedule" == '7 * * * *' ]]; then
            mode=pr
          elif [[ "$schedule" == '27 * * * *' ]]; then
            mode=merge
          elif [[ "$schedule" == '47 * * * *' ]]; then
            mode=closer
          else
            mode=pr
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
  run:
    needs: select
    uses: crownthrive1/CrownThrive-Support/.github/workflows/penta-pr-lifecycle-reusable.yml@main
    with:
      mode: ${{ needs.select.outputs.mode }}
    secrets: inherit
