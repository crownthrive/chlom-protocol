name: CHLOM Chain Evidence Fabric Certification

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/chlom/**"
      - "contracts/chlom-api-registry.v1.json"
      - "contracts/openapi.chlom-chain-fabric.v1.yaml"
      - "tests/chain-fabric.test.ts"
      - "package.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "vercel.json"
      - ".github/workflows/chlom-chain-evidence-fabric.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/chlom/**"
      - "contracts/chlom-api-registry.v1.json"
      - "contracts/openapi.chlom-chain-fabric.v1.yaml"
      - "tests/chain-fabric.test.ts"
      - "package.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "vercel.json"
      - ".github/workflows/chlom-chain-evidence-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chlom-chain-evidence-fabric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run certify
      - name: Verify fail-closed defaults
        run: |
          test "$(node -p "require('./contracts/chlom-api-registry.v1.json').authority.private_key_custody")" = "false"
          test "$(node -p "require('./contracts/chlom-api-registry.v1.json').authority.chain_broadcast.default")" = "false"
          grep -q "GOOGLE_BLOCKCHAIN_RPC" .env.example
          grep -q "2026-12-15" .env.example
