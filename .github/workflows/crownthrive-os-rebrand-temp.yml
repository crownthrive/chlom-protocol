name: TEMP CrownThrive OS CHLOM Rebrand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crownthrive-os-rebrand-temp.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CHLOM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Rewrite retired repository identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          old = 'CrownThrive-' + 'Support'
          pattern = re.compile(re.escape(old), re.IGNORECASE)
          changed = []
          for filename in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not filename or filename.startswith('.github/workflows/'):
                  continue
              path = Path(filename)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              rewritten, count = pattern.subn('CrownThrive-OS', text)
              if count:
                  path.write_text(rewritten, encoding='utf-8')
                  changed.append((filename, count))
          print(f'files={len(changed)} refs={sum(c for _,c in changed)}')
          for filename, count in changed:
              print(f'{filename}: {count}')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'CrownThrive OS Automation'
          git config user.email 'contact@crownthrive.com'
          git add -u
          git commit -m 'chore(os): migrate CHLOM references to CrownThrive-OS'
          git push origin HEAD:main
