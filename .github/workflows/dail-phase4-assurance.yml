name: DAIL Phase 4 Assurance (Bounded)

on:
  pull_request:
    paths:
      - "migrations/**"
      - "services/dail_v1/**"
      - "scripts/*dail*"
      - "tests/test_dail*.py"
      - "tests/test_chlom_mesh*_hardening.py"
      - "tests/test_verify_dail_lineage_snapshot.py"
      - "registry/core.yaml"
      - "registry/components.yaml"
      - "registry/roadmap.yaml"
      - "developers/manifests/dail-phase4-assurance.v1.json"
      - "docs/architecture/DAIL_PHASE4_ASSURANCE.md"
      - "artifacts/receipts/dail-*"
      - "recovery/dail_v1/**"
      - "supabase/functions/chlom-mesh-status/**"
      - "supabase/functions/chlom-mesh-control/**"
      - "requirements-dev.txt"
      - ".github/workflows/dail-phase4-assurance.yml"
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "services/dail_v1/**"
      - "scripts/*dail*"
      - "tests/test_dail*.py"
      - "tests/test_chlom_mesh*_hardening.py"
      - "tests/test_verify_dail_lineage_snapshot.py"
      - "registry/core.yaml"
      - "registry/components.yaml"
      - "registry/roadmap.yaml"
      - "developers/manifests/dail-phase4-assurance.v1.json"
      - "docs/architecture/DAIL_PHASE4_ASSURANCE.md"
      - "artifacts/receipts/dail-*"
      - "recovery/dail_v1/**"
      - "supabase/functions/chlom-mesh-status/**"
      - "supabase/functions/chlom-mesh-control/**"
      - "requirements-dev.txt"
      - ".github/workflows/dail-phase4-assurance.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Registry and unit assurance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development requirements
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate governed registry
        run: |
          set -Eeuo pipefail
          python scripts/validate_registry.py

      - name: Run full unit test discovery
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

  public-status-route-smoke:
    name: Public status-route smoke
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe sanitized CHLOM mesh status
        env:
          STATUS_URL: https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/chlom-mesh-status
        run: |
          set -Eeuo pipefail

          response_file="${RUNNER_TEMP}/chlom-mesh-status.json"
          http_status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 262144 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              "${STATUS_URL}"
          )"

          if [[ "${http_status}" != "200" ]]; then
            echo "CHLOM mesh status returned HTTP ${http_status}; expected 200" >&2
            exit 1
          fi

          python - "${response_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if path.stat().st_size > 262_144:
              raise SystemExit("status response exceeded the bounded 256 KiB limit")

          try:
              status = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"status response is not valid UTF-8 JSON: {exc}") from exc

          if not isinstance(status, dict):
              raise SystemExit("status response must be a JSON object")

          expected = {
              "contract": "ct.chlom.mesh.status.v1",
              "service": "ct.chlom.mesh.status.v1",
              "status": "ok",
              "decision": "ALLOW",
              "public_surface": True,
              "secret_values_exposed": False,
          }
          for key, value in expected.items():
              if status.get(key) != value:
                  raise SystemExit(
                      f"status field {key!r} was {status.get(key)!r}; expected {value!r}"
                  )

          control = status.get("control_plane")
          if not isinstance(control, dict):
              raise SystemExit("control_plane must be a JSON object")
          if control.get("operating_state") != "production_hot":
              raise SystemExit("control plane is not production_hot")
          if control.get("fail_closed") is not True:
              raise SystemExit("control plane is not fail-closed")
          if control.get("no_secret_exposure") is not True:
              raise SystemExit("control plane does not attest no_secret_exposure")

          summary = status.get("binding_summary")
          if not isinstance(summary, dict):
              raise SystemExit("binding_summary must be a JSON object")
          total = summary.get("total")
          if not isinstance(total, int) or total < 1:
              raise SystemExit("binding_summary.total must be a positive integer")
          if summary.get("bound") != total:
              raise SystemExit("not all governed bindings are bound")
          if summary.get("hold") != 0 or summary.get("degraded") != 0:
              raise SystemExit("governed bindings include a hold or degradation")

          heartbeat = status.get("latest_heartbeat")
          if not isinstance(heartbeat, dict) or heartbeat.get("state") != "hot":
              raise SystemExit("latest heartbeat is not hot")
          if heartbeat.get("hold_count") != 0 or heartbeat.get("degraded_count") != 0:
              raise SystemExit("latest heartbeat reports a hold or degradation")

          forbidden_keys = {
              "api_key",
              "apikey",
              "access_token",
              "authorization",
              "client_secret",
              "password",
              "private_key",
              "refresh_token",
              "service_role_key",
              "token",
          }

          def reject_secret_keys(value, location="$"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      normalized = str(key).strip().lower().replace("-", "_")
                      if normalized in forbidden_keys:
                          raise SystemExit(
                              f"status response exposed forbidden field {location}.{key}"
                          )
                      reject_secret_keys(child, f"{location}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      reject_secret_keys(child, f"{location}[{index}]")

          reject_secret_keys(status)
          print("PASS: bounded public hot route returned sanitized ALLOW state")
          PY
