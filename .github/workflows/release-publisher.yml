name: CHLOM Release Publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/chlom-*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: Release request JSON path
        required: true
        default: .github/release-requests/chlom-v3.0.0.json

permissions:
  contents: write

concurrency:
  group: chlom-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve release request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST='${{ inputs.request_file }}'
          else
            REQUEST=$(git diff --name-only HEAD^ HEAD | grep '^.github/release-requests/chlom-.*\.json$' | tail -1)
          fi
          test -n "$REQUEST"
          python -m json.tool "$REQUEST" >/dev/null
          TAG=$(jq -r '.tag' "$REQUEST")
          TARGET=$(jq -r '.target' "$REQUEST")
          TITLE=$(jq -r '.title' "$REQUEST")
          PACKAGE=$(jq -r '.package' "$REQUEST")
          for V in TAG TARGET TITLE PACKAGE; do test -n "${!V}" && test "${!V}" != "null"; done
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Validate release package
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE/RELEASE_NOTES.md"
          test -f "$PACKAGE/MANIFEST.json"
          python -m json.tool "$PACKAGE/MANIFEST.json" >/dev/null
          test "$(jq -r '.tag' "$PACKAGE/MANIFEST.json")" = "$TAG"
          test "$(jq -r '.target_ref' "$PACKAGE/MANIFEST.json")" = "$TARGET"

      - name: Publish or reconcile GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$PACKAGE/RELEASE_NOTES.md" --target "$TARGET"
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes-file "$PACKAGE/RELEASE_NOTES.md"
          fi

      - name: Verify release readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,name,url,isDraft,isPrerelease,targetCommitish
