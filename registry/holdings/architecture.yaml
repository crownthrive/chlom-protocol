phase_2_5_rules:
- Phase 2.5 starts from the Phase 2 commit so one later merge can contain both phases.
- Registry records are authoritative working inventory, not proof that a product is commercially live.
- Status is mutable; identity and lineage are persistent.
- Every active asset should converge on canonical identity, rights, support, analytics, domain, owner, lifecycle, and revenue metadata.
- Third-party platforms must not be the only copy of institutional knowledge or rights records.
- Confidential source documents and secrets stay out of the public repository.
